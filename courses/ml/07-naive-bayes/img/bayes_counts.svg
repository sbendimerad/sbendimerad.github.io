<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 335" width="800" height="335" role="img" aria-label="Bayes&#x27; theorem with counts: a test that is right 90% of the time" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Bayes&#x27; theorem with counts: a test that is right 90% of the time</title><rect width="800" height="335" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect x="290.0" y="15.0" width="220" height="40" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="400" y="35" font-size="14" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">10,000 people</text><line x1="400" y1="57" x2="210" y2="100" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="400" y1="57" x2="590" y2="100" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="110.0" y="100.0" width="200" height="40" rx="8" fill="#FDF1E7" stroke="#E4572E"/><text x="210" y="120" font-size="13" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">100 sick (1%)</text><rect x="490.0" y="100.0" width="200" height="40" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="590" y="120" font-size="13" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">9,900 healthy (99%)</text><line x1="210" y1="142" x2="120" y2="190" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="40.0" y="192.0" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#E4572E"/><text x="120" y="210" font-size="12" fill="#E4572E" font-weight="600" text-anchor="middle" dominant-baseline="middle">90 test positive</text><line x1="210" y1="142" x2="300" y2="190" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="220.0" y="192.0" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#666666"/><text x="300" y="210" font-size="12" fill="#666666" font-weight="600" text-anchor="middle" dominant-baseline="middle">10 test negative</text><line x1="590" y1="142" x2="500" y2="190" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="420.0" y="192.0" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#3B47C4"/><text x="500" y="210" font-size="12" fill="#3B47C4" font-weight="600" text-anchor="middle" dominant-baseline="middle">495 test positive</text><line x1="590" y1="142" x2="680" y2="190" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="600.0" y="192.0" width="160" height="36" rx="8" fill="#FFFFFF" stroke="#666666"/><text x="680" y="210" font-size="12" fill="#666666" font-weight="600" text-anchor="middle" dominant-baseline="middle">9,405 test negative</text><text x="400" y="262" font-size="14" fill="#111111" font-weight="600" text-anchor="middle" dominant-baseline="middle">Positive tests: 90 sick + 495 healthy = 585.</text><text x="400" y="288" font-size="14" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">P(sick | positive) = 90 / 585 ≈ 15%: most positive tests come from healthy people.</text><text x="400" y="318" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Test: positive for 90% of the sick and for 5% of the healthy.</text></svg>
