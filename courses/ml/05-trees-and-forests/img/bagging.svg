<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 405" width="800" height="405" role="img" aria-label="How a random forest is built: bootstrap samples, one tree each, then a vote" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>How a random forest is built: bootstrap samples, one tree each, then a vote</title><rect width="800" height="405" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect x="290.0" y="20.0" width="220" height="40" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="400" y="40" font-size="14" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">training data (n rows)</text><line x1="400" y1="62" x2="150" y2="108" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="55.0" y="110.0" width="190" height="40" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="150" y="130" font-size="13" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">bootstrap sample 1</text><text x="150" y="165" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">n rows drawn with replacement</text><line x1="150" y1="178" x2="150" y2="208" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="55.0" y="210.0" width="190" height="40" rx="8" fill="#EAF4EE" stroke="#2E7D4F"/><text x="150" y="230" font-size="14" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">tree 1</text><text x="150" y="265" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">random subset of features at each split</text><line x1="150" y1="280" x2="400" y2="318" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="400" y1="62" x2="400" y2="108" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="305.0" y="110.0" width="190" height="40" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="400" y="130" font-size="13" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">bootstrap sample 2</text><text x="400" y="165" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">n rows drawn with replacement</text><line x1="400" y1="178" x2="400" y2="208" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="305.0" y="210.0" width="190" height="40" rx="8" fill="#EAF4EE" stroke="#2E7D4F"/><text x="400" y="230" font-size="14" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">tree 2</text><text x="400" y="265" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">random subset of features at each split</text><line x1="400" y1="280" x2="400" y2="318" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="400" y1="62" x2="650" y2="108" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="555.0" y="110.0" width="190" height="40" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="650" y="130" font-size="13" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">bootstrap sample 3</text><text x="650" y="165" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">n rows drawn with replacement</text><line x1="650" y1="178" x2="650" y2="208" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="555.0" y="210.0" width="190" height="40" rx="8" fill="#EAF4EE" stroke="#2E7D4F"/><text x="650" y="230" font-size="14" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">tree 3</text><text x="650" y="265" font-size="11" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">random subset of features at each split</text><line x1="650" y1="280" x2="400" y2="318" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="250.0" y="320.0" width="300" height="40" rx="8" fill="#FDF1E7" stroke="#E4572E"/><text x="400" y="340" font-size="13" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">vote (classification) or average (regression)</text><text x="400" y="385" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Bagging = bootstrap + aggregating. A random forest adds random features at each split.</text></svg>
