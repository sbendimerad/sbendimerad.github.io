<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-label="A small decision tree for a loan decision" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>A small decision tree for a loan decision</title><rect width="800" height="350" fill="#FFFFFF"/><line x1="400" y1="70" x2="220" y2="140" stroke="#666666" stroke-width="2"/><text x="296.0" y="105.0" font-size="12" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">yes</text><line x1="400" y1="70" x2="580" y2="140" stroke="#666666" stroke-width="2"/><text x="504.0" y="105.0" font-size="12" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">no</text><line x1="220" y1="180" x2="120" y2="250" stroke="#666666" stroke-width="2"/><text x="156.0" y="215.0" font-size="12" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">yes</text><line x1="220" y1="180" x2="320" y2="250" stroke="#666666" stroke-width="2"/><text x="284.0" y="215.0" font-size="12" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">no</text><line x1="580" y1="180" x2="480" y2="250" stroke="#666666" stroke-width="2"/><text x="516.0" y="215.0" font-size="12" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">yes</text><line x1="580" y1="180" x2="680" y2="250" stroke="#666666" stroke-width="2"/><text x="644.0" y="215.0" font-size="12" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">no</text><rect x="325" y="30" width="150" height="40" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="400" y="50" font-size="14" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle">age &lt; 30 ?</text><rect x="145" y="140" width="150" height="40" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="220" y="160" font-size="14" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle">income &lt; 2 k€ ?</text><rect x="505" y="140" width="150" height="40" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="580" y="160" font-size="14" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle">has a loan ?</text><rect x="45" y="250" width="150" height="40" rx="20" fill="#EEF0FC" stroke="#E4572E"/><text x="120" y="270" font-size="14" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">refuse</text><rect x="245" y="250" width="150" height="40" rx="20" fill="#EEF0FC" stroke="#3B47C4"/><text x="320" y="270" font-size="14" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">accept</text><rect x="405" y="250" width="150" height="40" rx="20" fill="#EEF0FC" stroke="#E4572E"/><text x="480" y="270" font-size="14" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">refuse</text><rect x="605" y="250" width="150" height="40" rx="20" fill="#EEF0FC" stroke="#3B47C4"/><text x="680" y="270" font-size="14" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">accept</text><text x="400" y="330" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Each question splits the data; the leaves give the prediction (here: a loan decision).</text></svg>
