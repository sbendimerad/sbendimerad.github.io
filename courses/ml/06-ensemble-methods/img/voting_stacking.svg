<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 315" width="800" height="315" role="img" aria-label="Voting combines predictions with a fixed rule, stacking learns how to combine them" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Voting combines predictions with a fixed rule, stacking learns how to combine them</title><rect width="800" height="315" fill="#FFFFFF"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><text x="190" y="28" font-size="17" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Voting</text><rect x="90.0" y="52.0" width="200" height="36" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="190" y="70" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle">training data</text><line x1="190" y1="88" x2="70" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="14.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="70" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">logistic reg.</text><line x1="70" y1="166" x2="190" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="190" y1="88" x2="190" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="134.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="190" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">random forest</text><line x1="190" y1="166" x2="190" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="190" y1="88" x2="310" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="254.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="310" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">k-NN</text><line x1="310" y1="166" x2="190" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="55.0" y="222.0" width="270" height="40" rx="8" fill="#FDF1E7" stroke="#E4572E"/><text x="190" y="242" font-size="12" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">majority vote or average of probabilities</text><text x="190" y="290" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">fixed rule: every model counts the same</text><text x="610" y="28" font-size="17" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Stacking</text><rect x="510.0" y="52.0" width="200" height="36" rx="8" fill="#F4F4F5" stroke="#111111"/><text x="610" y="70" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle">training data</text><line x1="610" y1="88" x2="490" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="434.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="490" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">logistic reg.</text><line x1="490" y1="166" x2="610" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="610" y1="88" x2="610" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="554.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="610" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">random forest</text><line x1="610" y1="166" x2="610" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><line x1="610" y1="88" x2="730" y2="128" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="674.0" y="130.0" width="112" height="36" rx="8" fill="#EEF0FC" stroke="#3B47C4"/><text x="730" y="148" font-size="12" fill="#3B47C4" font-weight="500" text-anchor="middle" dominant-baseline="middle">k-NN</text><line x1="730" y1="166" x2="610" y2="222" stroke="#666666" stroke-width="1.6" marker-end="url(#arr)"/><rect x="475.0" y="222.0" width="270" height="40" rx="8" fill="#FDF1E7" stroke="#E4572E"/><text x="610" y="242" font-size="12" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">meta-model (e.g. logistic regression)</text><text x="610" y="290" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">learned rule: trained on the models&#x27; predictions</text><line x1="400" y1="20" x2="400" y2="300" stroke="#E5E5E5" stroke-width="1.5"/></svg>
