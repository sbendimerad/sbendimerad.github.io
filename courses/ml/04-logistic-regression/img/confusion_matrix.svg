<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="Confusion matrix with true and false positives and negatives" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Confusion matrix with true and false positives and negatives</title><rect width="640" height="400" fill="#FFFFFF"/><text x="330" y="26" font-size="18" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Confusion matrix</text><rect x="180" y="50" width="420" height="40" fill="#F4F4F5"/><text x="390" y="70" font-size="14" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Predicted</text><text x="285" y="108" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">No (0)</text><text x="495" y="108" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Yes (1)</text><rect x="20" y="125" width="60" height="220" fill="#F4F4F5"/><text x="50" y="235" font-size="14" font-weight="700" fill="#111111" text-anchor="middle" transform="rotate(-90 50 235)">Actual</text><text x="130" y="180" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">No (0)</text><text x="130" y="290" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Yes (1)</text><rect x="180" y="125" width="210" height="110" fill="#EEF0FC" stroke="#FFFFFF" stroke-width="3"/><text x="285" y="170" font-size="14" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">True negatives (TN)</text><text x="285" y="195" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">correctly rejected</text><rect x="390" y="125" width="210" height="110" fill="#FDF1E7" stroke="#FFFFFF" stroke-width="3"/><text x="495" y="170" font-size="14" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">False positives (FP)</text><text x="495" y="195" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">false alarm</text><rect x="180" y="235" width="210" height="110" fill="#FDF1E7" stroke="#FFFFFF" stroke-width="3"/><text x="285" y="280" font-size="14" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">False negatives (FN)</text><text x="285" y="305" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">missed</text><rect x="390" y="235" width="210" height="110" fill="#EEF0FC" stroke="#FFFFFF" stroke-width="3"/><text x="495" y="280" font-size="14" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">True positives (TP)</text><text x="495" y="305" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">correctly found</text><text x="330" y="375" font-size="14" fill="#111111" font-weight="600" text-anchor="middle" dominant-baseline="middle">precision = TP / (TP + FP)     recall = TP / (TP + FN)</text></svg>
