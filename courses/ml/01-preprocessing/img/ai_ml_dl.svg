<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="820" height="460" role="img" aria-label="Deep learning is part of machine learning, which is part of artificial intelligence" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Deep learning is part of machine learning, which is part of artificial intelligence</title><rect width="820" height="460" fill="#FFFFFF"/><circle cx="230" cy="230" r="210" fill="#1B2050"/><circle cx="230" cy="290" r="140" fill="#3B47C4"/><circle cx="230" cy="340" r="80" fill="#F2C14E"/><text x="230" y="75" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="middle">Artificial intelligence</text><text x="230" y="195" font-size="20" fill="#FFFFFF" font-weight="700" text-anchor="middle" dominant-baseline="middle">Machine learning</text><text x="230" y="340" font-size="18" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Deep learning</text><line x1="440" y1="75" x2="480" y2="75" stroke="#666666"/><text x="490" y="57" font-size="15" fill="#111111" font-weight="700" text-anchor="start" dominant-baseline="middle">Artificial intelligence</text><text x="490" y="79" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">Systems that perform tasks that normally</text><text x="490" y="97" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">need human intelligence.</text><line x1="440" y1="195" x2="480" y2="195" stroke="#666666"/><text x="490" y="177" font-size="15" fill="#111111" font-weight="700" text-anchor="start" dominant-baseline="middle">Machine learning</text><text x="490" y="199" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">Systems that learn a task from data</text><text x="490" y="217" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">instead of following hand-written rules.</text><line x1="440" y1="340" x2="480" y2="340" stroke="#666666"/><text x="490" y="322" font-size="15" fill="#111111" font-weight="700" text-anchor="start" dominant-baseline="middle">Deep learning</text><text x="490" y="344" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">Machine learning with neural networks</text><text x="490" y="362" font-size="13" fill="#666666" font-weight="400" text-anchor="start" dominant-baseline="middle">of many layers, learning from raw data.</text></svg>
