<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 380" width="840" height="380" role="img" aria-label="Supervised, unsupervised and reinforcement learning, with examples" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Supervised, unsupervised and reinforcement learning, with examples</title><rect width="840" height="380" fill="#FFFFFF"/><text x="420" y="30" font-size="20" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Three families of machine learning</text><rect x="20" y="60" width="255" height="300" rx="14" fill="#EEF0FC"/><text x="147" y="92" font-size="16" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">Supervised learning</text><text x="147" y="116" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Learn from labelled examples</text><rect x="35" y="150" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="147" y="178" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Regression</text><text x="147" y="202" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">predict a number: price, demand</text><rect x="35" y="250" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="147" y="278" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Classification</text><text x="147" y="302" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">predict a class: spam or not, churn</text><rect x="295" y="60" width="255" height="300" rx="14" fill="#FDF1E7"/><text x="422" y="92" font-size="16" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">Unsupervised learning</text><text x="422" y="116" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Find structure without labels</text><rect x="310" y="150" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="422" y="178" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Clustering</text><text x="422" y="202" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">group similar customers</text><rect x="310" y="250" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="422" y="278" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Dimensionality reduction</text><text x="422" y="302" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">summarise many columns</text><rect x="570" y="60" width="255" height="300" rx="14" fill="#E9F4EE"/><text x="697" y="92" font-size="16" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">Reinforcement learning</text><text x="697" y="116" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Learn by trial and reward</text><rect x="585" y="150" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="697" y="178" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Control</text><text x="697" y="202" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">robots, games</text><rect x="585" y="250" width="225" height="80" rx="10" fill="#FFFFFF"/><text x="697" y="278" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Decisions</text><text x="697" y="302" font-size="12.5" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">recommendations over time</text></svg>
