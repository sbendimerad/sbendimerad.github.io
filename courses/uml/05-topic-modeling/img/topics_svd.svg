<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Truncated SVD: the document-term matrix A is approximated by U (documents by topics) times Sigma (topic strengths) times V transposed (topics by words), keeping only the first k topics." font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Truncated SVD: the document-term matrix A is approximated by U (documents by topics) times Sigma (topic strengths) times V transposed (topics by words), keeping only the first k topics.</title><rect width="860" height="400" fill="#FFFFFF"/><text x="430.0" y="26" font-size="18" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Truncated SVD: keep only the k strongest topics</text><rect x="30" y="80" width="230" height="170" fill="#EEF0FC" stroke="#3B47C4" stroke-width="2"/><text x="145.0" y="66" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">m words</text><text x="18" y="165.0" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 18 165.0)">n documents</text><text x="145.0" y="165.0" font-size="34" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">A</text><text x="286" y="165.0" font-size="34" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">≈</text><rect x="312" y="80" width="120" height="170" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="5 4"/><rect x="312" y="80" width="40" height="170" fill="#FCE3DA" stroke="#E4572E" stroke-width="2"/><text x="332.0" y="165.0" font-size="26" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">U</text><text x="392.0" y="165.0" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">dropped</text><text x="332.0" y="66" font-size="13" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">k</text><text x="372.0" y="48" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">r topics</text><rect x="456" y="80" width="120" height="120" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="5 4"/><rect x="456" y="80" width="40" height="40" fill="#FDF3D6" stroke="#F2C14E" stroke-width="2"/><circle cx="466.0" cy="90.0" r="10.0" fill="#B8860B"/><circle cx="486.0" cy="110.0" r="8.7" fill="#B8860B"/><circle cx="506.0" cy="130.0" r="7.3" fill="#E5E5E5"/><circle cx="526.0" cy="150.0" r="6.0" fill="#E5E5E5"/><circle cx="546.0" cy="170.0" r="4.7" fill="#E5E5E5"/><circle cx="566.0" cy="190.0" r="3.3" fill="#E5E5E5"/><text x="538.0" y="114.0" font-size="26" fill="#B8860B" font-weight="700" text-anchor="middle" dominant-baseline="middle">Σ</text><text x="476.0" y="66" font-size="13" fill="#B8860B" font-weight="700" text-anchor="middle" dominant-baseline="middle">k</text><rect x="600" y="80" width="200" height="120" fill="#FFFFFF" stroke="#E5E5E5" stroke-width="2" stroke-dasharray="5 4"/><rect x="600" y="80" width="200" height="40" fill="#DDEFE3" stroke="#2E7D4F" stroke-width="2"/><text x="700.0" y="100.0" font-size="22" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">Vᵀ</text><text x="700.0" y="160.0" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">dropped</text><text x="700.0" y="66" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">m words</text><text x="812" y="100.0" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start" dominant-baseline="middle">k</text><text x="145.0" y="290" font-size="15" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">documents × words</text><text x="145.0" y="312" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">the TF-IDF (or count)</text><text x="145.0" y="331" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">of each word in each document</text><text x="372.0" y="290" font-size="15" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">documents × topics</text><text x="372.0" y="312" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">how much each document</text><text x="372.0" y="331" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">is about each topic</text><text x="516.0" y="290" font-size="15" fill="#B8860B" font-weight="700" text-anchor="middle" dominant-baseline="middle">topic strengths</text><text x="516.0" y="312" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">σ₁ ≥ σ₂ ≥ … ≥ 0</text><text x="516.0" y="331" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">(singular values)</text><text x="700.0" y="290" font-size="15" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">topics × words</text><text x="700.0" y="312" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">the weight of each word</text><text x="700.0" y="331" font-size="13" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">in each topic</text><text x="430.0" y="378" font-size="13" fill="#111111" font-weight="400" text-anchor="middle" dominant-baseline="middle">Keeping k columns of U, k values of Σ and k rows of Vᵀ gives the best approximation of A with only k topics.</text></svg>
