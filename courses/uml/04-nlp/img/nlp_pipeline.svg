<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="The text preprocessing pipeline, step by step, on the sentence &#x27;The cats are chasing mice!&#x27;" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>The text preprocessing pipeline, step by step, on the sentence &#x27;The cats are chasing mice!&#x27;</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#666666"/></marker></defs><rect width="900" height="330" fill="#FFFFFF"/><rect x="40" y="40" width="260" height="96" rx="10" fill="#EEF0FC" stroke="#3B47C4" stroke-width="2"/><text x="170.0" y="62" font-size="15" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">1. Raw text</text><text x="170.0" y="92" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">The cats are chasing mice!</text><text x="170.0" y="116" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">a string of characters</text><rect x="320" y="40" width="260" height="96" rx="10" fill="#EEF0FC" stroke="#3B47C4" stroke-width="2"/><text x="450.0" y="62" font-size="15" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">2. Clean</text><text x="450.0" y="92" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">the cats are chasing mice</text><text x="450.0" y="116" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">lower case, no punctuation</text><rect x="600" y="40" width="260" height="96" rx="10" fill="#EEF0FC" stroke="#3B47C4" stroke-width="2"/><text x="730.0" y="62" font-size="15" fill="#3B47C4" font-weight="700" text-anchor="middle" dominant-baseline="middle">3. Tokenize</text><text x="730.0" y="92" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">[the, cats, are, chasing, mice]</text><text x="730.0" y="116" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">a list of words (tokens)</text><rect x="600" y="200" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#E4572E" stroke-width="2"/><text x="730.0" y="222" font-size="15" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">4. Remove stop words</text><text x="730.0" y="252" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">[cats, chasing, mice]</text><text x="730.0" y="276" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">drop &#x27;the&#x27;, &#x27;are&#x27;…</text><rect x="320" y="200" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#E4572E" stroke-width="2"/><text x="450.0" y="222" font-size="15" fill="#E4572E" font-weight="700" text-anchor="middle" dominant-baseline="middle">5. Lemmatize</text><text x="450.0" y="252" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">[cat, chase, mouse]</text><text x="450.0" y="276" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">each word → its dictionary form</text><rect x="40" y="200" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#2E7D4F" stroke-width="2"/><text x="170.0" y="222" font-size="15" fill="#2E7D4F" font-weight="700" text-anchor="middle" dominant-baseline="middle">6. Vectorize</text><text x="170.0" y="252" font-size="13" fill="#111111" font-weight="500" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Consolas, Menlo, monospace">cat:1 chase:1 mouse:1 dog:0</text><text x="170.0" y="276" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">one number per word of the vocabulary</text><line x1="300" y1="88.0" x2="316" y2="88.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><line x1="580" y1="88.0" x2="596" y2="88.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><line x1="730.0" y1="136" x2="730.0" y2="196" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><line x1="600" y1="248.0" x2="584" y2="248.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><line x1="320" y1="248.0" x2="304" y2="248.0" stroke="#666666" stroke-width="2" marker-end="url(#arrow)"/><text x="450.0" y="318" font-size="12" fill="#666666" font-weight="400" text-anchor="middle" dominant-baseline="middle">Blue: prepare the text · Coral: keep only the meaningful words · Green: turn the words into numbers</text></svg>
