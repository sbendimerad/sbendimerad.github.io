<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 280" width="740" height="280" role="img" aria-label="The client sends an HTTP request to the server, which sends back a response with data in JSON" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The client sends an HTTP request to the server, which sends back a response with data in JSON</title>
<rect width="740" height="280" fill="#FFFFFF"/>
<defs><marker id="arrow3B47C4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3B47C4"/></marker><marker id="arrow2E7D4F" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E7D4F"/></marker></defs>
<rect x="40" y="70" width="180" height="120" rx="14" fill="#EEF0FC" stroke="#D4D4D4"/>
<text x="130" y="115" font-size="16" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Client</text>
<text x="130" y="145" font-size="12" fill="#555555" font-weight="400" text-anchor="middle" dominant-baseline="middle">your Python code</text>
<rect x="520" y="70" width="180" height="120" rx="14" fill="#F4F4F5" stroke="#D4D4D4"/>
<text x="610" y="115" font-size="16" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">Server</text>
<text x="610" y="145" font-size="12" fill="#555555" font-weight="400" text-anchor="middle" dominant-baseline="middle">the API</text>
<line x1="230" y1="100" x2="510" y2="100" stroke="#3B47C4" stroke-width="2" marker-end="url(#arrow3B47C4)"/>
<text x="370.0" y="88.0" font-size="12" fill="#3B47C4" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">1. request: GET /users/42</text>
<line x1="510" y1="160" x2="230" y2="160" stroke="#2E7D4F" stroke-width="2" marker-end="url(#arrow2E7D4F)"/>
<text x="370.0" y="174.0" font-size="12" fill="#2E7D4F" font-weight="600" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">2. response: 200 OK + JSON</text>
<text x="370" y="250" font-size="13" fill="#2E7D4F" font-weight="400" text-anchor="middle" dominant-baseline="middle" font-family="'JetBrains Mono', Menlo, Consolas, monospace">{ &quot;id&quot;: 42, &quot;name&quot;: &quot;Ada&quot; }</text>
<text x="370" y="30" font-size="15" fill="#111111" font-weight="700" text-anchor="middle" dominant-baseline="middle">The HTTP request–response cycle</text>
</svg>
