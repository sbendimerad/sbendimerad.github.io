<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Illustration of a black meal-voucher card with the slogan &#x27;The most useless card of the moment&#x27;" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Illustration of a black meal-voucher card with the slogan &#x27;The most useless card of the moment&#x27;</title>
<rect width="900" height="420" rx="14" fill="#111214"/><defs><linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4572E"/><stop offset="0.5" stop-color="#C13584"/><stop offset="1" stop-color="#3B47C4"/></linearGradient></defs><ellipse cx="660" cy="230" rx="230" ry="150" fill="url(#glow)" opacity="0.45"/><text x="50" y="80" font-size="16" fill="#BBBBBB">An outdoor ad, 2020 (illustration)</text><text x="50" y="150" font-size="50" font-weight="800" fill="#FFFFFF">The most</text><text x="50" y="206" font-size="50" font-weight="800" fill="#FFFFFF">useless card</text><text x="50" y="262" font-size="50" font-weight="800" fill="#FFFFFF">of the moment.</text><text x="50" y="345" font-size="16" fill="#DDDDDD">Accepted in restaurants, shops, cinemas…</text><text x="50" y="370" font-size="16" fill="#DDDDDD">which were all closed during the lockdown.</text><g transform="translate(560,140) rotate(-14)"><rect width="270" height="170" rx="16" fill="#1C1C1E" stroke="#555"/><rect x="26" y="58" width="44" height="34" rx="6" fill="#C9B26B"/><text x="26" y="140" font-size="16" fill="#CCCCCC" letter-spacing="3">•••• •••• •••• 2020</text><text x="244" y="34" font-size="14" fill="#CCCCCC" text-anchor="end">meal card</text></g></svg>
